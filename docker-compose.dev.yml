# NOFX Development/Test Deployment
# Using test images for dev validation
#
# One-click install (dev):
#   curl -fsSL https://raw.githubusercontent.com/TG7744/nofx20260206/dev/install-dev.sh | bash
# Manual:
#   curl -O https://raw.githubusercontent.com/TG7744/nofx20260206/dev/docker-compose.dev.yml
#   docker compose -f docker-compose.dev.yml up -d

services:
  nofx:
    image: small147/nofx20260204:backend-test
    container_name: nofx-trading-dev
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nofx-frontend:
    image: small147/nofx20260206:frontend-test
    container_name: nofx-frontend-dev
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
